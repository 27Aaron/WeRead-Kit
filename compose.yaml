services:
  wxread:
    image: ghcr.io/27aaron/wxread:latest
    container_name: wxread
    restart: unless-stopped
    stop_signal: SIGINT
    ports:
      - "8080:8080"
    environment:
      WXREAD_HOST: 0.0.0.0
      WXREAD_PORT: 8080
      WXREAD_DB: /data/wxread.db
      WXREAD_USERNAME: ${WXREAD_USERNAME:-}
      WXREAD_PASSWORD: ${WXREAD_PASSWORD:-}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
