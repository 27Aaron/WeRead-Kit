<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f6f4ef" />
  <title>微信读书</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <script>
    // 启动前先确定主题,避免亮暗闪烁;优先取用户手动选择,其次跟随系统。
    document.documentElement.dataset.theme =
      localStorage.getItem("wxread-theme") ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  </script>
  <link rel="stylesheet" href="https://gw.alipayobjects.com/os/k/jinkai/style.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="/style.css" />
</head>

<body>
  <aside class="sidebar">
    <a class="brand" href="/" id="brand-link">
      <img class="brand-mark" src="/favicon.png" alt="" aria-hidden="true" />
      <span class="brand-text">微信读书</span>
    </a>
    <nav class="nav">
      <a class="nav-item active" href="#accounts" data-view="accounts">
        <span class="nav-icon" data-icon="users-round"></span>我的账号
      </a>
      <a class="nav-item" href="#challenge" data-view="challenge">
        <span class="nav-icon" data-icon="book-open"></span>自动阅读
      </a>
      <a class="nav-item" href="#logs" data-view="logs">
        <span class="nav-icon" data-icon="scroll-text"></span>运行日志
      </a>
      <a class="nav-item" href="#settings" data-view="settings">
        <span class="nav-icon" data-icon="settings-2"></span>推送设置
      </a>
    </nav>
    <button id="nav-toggle" class="nav-toggle" title="菜单" aria-label="菜单" aria-expanded="false">
      <span class="nav-icon" data-icon="menu"></span>
    </button>
    <div class="sidebar-foot">
      <button id="theme-toggle" class="theme-toggle" title="切换深浅主题">
        <span class="nav-icon" data-icon="moon"></span><span id="theme-label">深色</span>
      </button>
    </div>
  </aside>

  <div class="workspace">
    <main>
      <!-- 我的账号 -->
      <section id="view-accounts" class="view">
        <div class="page-head">
          <div class="page-head-copy">
            <h1 class="page-title">我的账号</h1>
          </div>
          <div class="page-actions">
            <button id="reload-btn" class="btn"><span class="nav-icon" data-icon="refresh-cw"></span>刷新</button>
            <button id="add-btn" class="btn primary"><span class="nav-icon" data-icon="user"></span>添加账户</button>
          </div>
        </div>
        <div class="panel">
          <div class="panel-bar">
            <span class="panel-title">全部账号 <b id="account-count">0</b></span>
            <label class="search">
              <span class="nav-icon" data-icon="search"></span>
              <input id="account-search" type="search" placeholder="搜索昵称 / 备注 / ID" />
            </label>
          </div>
          <div id="account-list" class="account-list"></div>
          <div id="empty" class="empty hidden">
            <span class="nav-icon" data-icon="book-open"></span>
            <h3 id="empty-title">从连接第一个账号开始</h3>
            <p id="empty-desc">用微信扫一扫,即可把阅读账号添加到这里。</p>
          </div>
          <div class="panel-foot">
            <span id="list-summary">正在读取本地账号…</span>
          </div>
        </div>
      </section>

      <!-- 自动阅读 -->
      <section id="view-challenge" class="view hidden">
        <div class="page-head">
          <div class="page-head-copy">
            <h1 class="page-title">自动阅读</h1>
          </div>
          <label class="field">账号
            <select id="challenge-account" class="select"></select>
          </label>
        </div>
        <div id="challenge-banner" class="banner off">
          <span class="banner-state" id="challenge-state">未开启</span>
          <span class="banner-item">开始时间 <b id="challenge-runat">—</b></span>
          <span class="banner-item">每天时长 <b id="challenge-minutes">—</b></span>
        </div>
        <div id="challenge-panel" class="panel">
          <div class="config-row">
            <label class="switch-label">
              <span class="switch"><input type="checkbox" id="challenge-enabled" /><i></i></span>
              每天自动阅读
            </label>
            <label class="field-inline">开始时间
              <select id="challenge-runat-input" class="select"></select>
            </label>
            <label class="field-inline">每天时长
              <input type="number" id="challenge-minutes-input" min="1" max="480" value="30" /> 分钟
            </label>
          </div>
          <div class="books-head">选择书籍 <small>可多选;选多本时每天随机刷其中一本</small></div>
          <div id="challenge-books" class="book-grid"></div>
          <div class="panel-foot ops-between">
            <span id="challenge-laststatus" class="dim">尚未执行过</span>
            <span class="ops">
              <button id="challenge-run" class="btn"><span class="nav-icon" data-icon="play"></span>立即刷一次</button>
              <button id="challenge-pause" class="btn hidden"><span class="nav-icon"
                  data-icon="pause"></span>暂停</button>
              <button id="challenge-stop" class="btn danger hidden"><span class="nav-icon"
                  data-icon="square"></span>停止</button>
              <button id="challenge-save" class="btn primary"><span class="nav-icon"
                  data-icon="save"></span>保存配置</button>
            </span>
          </div>
        </div>
        <div id="challenge-empty" class="empty hidden">
          <span class="nav-icon" data-icon="book-open"></span>
          <h3>还没有账号</h3>
          <p>先到「我的账号」扫码添加一个,再回来开启自动阅读。</p>
          <button id="challenge-goto-accounts" class="btn primary">去添加账号</button>
        </div>
      </section>

      <!-- 运行日志 -->
      <section id="view-logs" class="view hidden">
        <div class="page-head">
          <div class="page-head-copy">
            <h1 class="page-title">运行日志</h1>
          </div>
          <div class="logs-toolbar">
            <select id="log-alias" class="select">
              <option value="">全部账号</option>
            </select>
            <select id="log-level" class="select">
              <option value="">全部级别</option>
              <option value="info">info</option>
              <option value="warn">warn</option>
              <option value="error">error</option>
            </select>
            <button id="logs-reload" class="btn"><span class="nav-icon" data-icon="refresh-cw"></span>刷新</button>
            <button id="logs-clear" class="btn danger"><span class="nav-icon" data-icon="trash"></span>清空</button>
          </div>
        </div>
        <div class="panel">
          <div class="logs-header">
            <span>时间</span><span>级别</span><span>来源</span><span>账号</span><span>内容</span>
          </div>
          <div id="logs-list" class="logs-list">
            <p class="empty">暂无日志</p>
          </div>
          <div class="panel-foot">
            <span>自动刷新:每 10 秒</span>
            <span id="logs-updated">—</span>
          </div>
        </div>
      </section>

      <!-- 推送设置 -->
      <section id="view-settings" class="view hidden">
        <div class="page-head">
          <div class="page-head-copy">
            <h1 class="page-title">推送设置</h1>
          </div>
        </div>
        <div id="push-list" class="push-list"></div>
      </section>
    </main>
  </div>

  <!-- 扫码登录 -->
  <dialog id="login-dialog" class="dialog" aria-labelledby="login-title">
    <div class="dialog-body">
      <button id="login-close" class="dialog-close" aria-label="关闭">×</button>
      <h2 id="login-title">添加账户</h2>
      <div id="qr-area" class="qr-area hidden">
        <img id="qr-img" width="220" height="220" alt="微信扫码登录微信读书" />
        <p id="login-status" class="status" role="status"></p>
        <p class="dialog-note">打开微信扫一扫,并在手机上确认登录</p>
      </div>
      <div class="dialog-ops">
        <button id="login-start" class="btn primary block"><span class="nav-icon" data-icon="refresh-cw"></span><span
            id="login-start-text">生成登录二维码</span></button>
      </div>
    </div>
  </dialog>

  <!-- 账号详情 -->
  <dialog id="detail-dialog" class="dialog dialog-wide" aria-labelledby="detail-title">
    <div class="dialog-body">
      <button id="detail-close" class="dialog-close" aria-label="关闭">×</button>
      <h2 id="detail-title">账号详情</h2>
      <div id="detail-content" class="detail-content">
        <p class="empty">正在加载…</p>
      </div>
      <div class="dialog-ops">
        <button id="detail-reload" class="btn"><span class="nav-icon" data-icon="refresh-cw"></span>刷新数据</button>
      </div>
    </div>
  </dialog>

  <div id="toast" class="toast hidden" popover="manual" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>

</html>
