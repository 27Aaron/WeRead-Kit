name: Update package hashes

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        required: false
        type: string

concurrency:
  group: update-hashes
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    name: Update and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      patch: ${{ steps.serialize.outputs.patch }}
      tag: ${{ steps.version.outputs.tag }}
      allow_lock: ${{ steps.hashes.outputs.allow_lock }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            log-lines = 25

      - name: Update package hashes
        id: hashes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          target=""
          if [[ -n $INPUT_TAG ]]; then
            target=$INPUT_TAG
          elif [[ $EVENT_NAME == push ]]; then
            target=$REF_NAME
          fi
          # go.mod 工具链要求高于锁定 nixpkgs 时,刷新 nixpkgs 重试一次;
          # 此时 flake.lock 一并变更,随 hashes.json 进 PR。
          allow_lock=false
          if ! nix/update.sh ${target:+"$target"}; then
            nix flake update nixpkgs
            nix/update.sh ${target:+"$target"}
            allow_lock=true
          fi
          echo "allow_lock=$allow_lock" >>"$GITHUB_OUTPUT"

      - name: Resolve updated version
        id: version
        run: echo "tag=v$(jq -r .version nix/hashes.json)" >>"$GITHUB_OUTPUT"

      - name: Detect and validate changed paths
        id: detect
        run: |
          set -euo pipefail

          untracked=$(git ls-files --others --exclude-standard)
          if [[ -n $untracked ]]; then
            echo "Updater created unexpected untracked files:" >&2
            printf '%s\n' "$untracked" >&2
            exit 1
          fi

          git diff --name-only --output="$RUNNER_TEMP/changed-files" HEAD
          if [[ ! -s $RUNNER_TEMP/changed-files ]]; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          allowed=(nix/hashes.json)
          if [[ ${{ steps.hashes.outputs.allow_lock }} == true ]]; then
            allowed+=(flake.lock)
          fi
          while IFS= read -r changed_file; do
            if [[ " ${allowed[*]} " != *" $changed_file "* ]]; then
              echo "Updater changed an unexpected path: $changed_file" >&2
              exit 1
            fi
          done <"$RUNNER_TEMP/changed-files"

          echo "changed=true" >>"$GITHUB_OUTPUT"

      - name: Validate update
        if: steps.detect.outputs.changed == 'true'
        run: |
          set -euo pipefail
          nix build .#weread-kit --no-link
          nix flake check --no-build --all-systems --no-write-lock-file
          git diff --check

      - name: Serialize validated patch
        id: serialize
        if: steps.detect.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git diff --binary --output="$RUNNER_TEMP/hashes-update.patch" HEAD
          echo "patch=$(base64 --wrap=0 "$RUNNER_TEMP/hashes-update.patch")" >>"$GITHUB_OUTPUT"

  publish:
    name: Publish hashes update pull request
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Apply validated update
        env:
          HASHES_UPDATE_PATCH: ${{ needs.update.outputs.patch }}
        run: printf '%s' "$HASHES_UPDATE_PATCH" | base64 --decode | git apply

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.UPDATE_PR_TOKEN || github.token }}
          # tag 触发时检出的是 detached commit,必须显式指定 base 才能开 PR。
          base: main
          author: "Aaron's Bot <155336205+3ayonara@users.noreply.github.com>"
          committer: "Aaron's Bot <155336205+3ayonara@users.noreply.github.com>"
          branch: automation/update-hashes
          delete-branch: true
          commit-message: |
            build(deps): update package hashes for ${{ needs.update.outputs.tag }}

            Co-authored-by: Aaron <85681241+27Aaron@users.noreply.github.com>
          title: "build(deps): update package hashes for ${{ needs.update.outputs.tag }}"
          body: |
            Refresh `version`, `srcHash`, and `vendorHash` in `nix/hashes.json` to
            build ${{ needs.update.outputs.tag }}.
            ${{ needs.update.outputs.allow_lock == 'true' && 'Also refreshes `flake.lock`: the pinned nixpkgs Go toolchain was older than the new `go.mod` requires.' || '' }}

            Validated with `nix build .#weread-kit`, `nix flake check` and `git diff --check`.
          assignees: 27Aaron
          labels: |
            automation
            source-update
