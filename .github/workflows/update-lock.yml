name: Update flake lock

on:
  workflow_dispatch:
  schedule:
    - cron: "13 20 * * *"

concurrency:
  group: update-lock
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    name: Update and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      patch: ${{ steps.serialize.outputs.patch }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            log-lines = 25

      - name: Update flake lock
        run: nix flake update

      - name: Detect and validate changed paths
        id: detect
        shell: bash
        run: |
          set -o errexit
          set -o nounset
          set -o pipefail

          untracked=$(git ls-files --others --exclude-standard)
          if [[ -n $untracked ]]; then
            echo "Updater created unexpected untracked files:" >&2
            printf '%s\n' "$untracked" >&2
            exit 1
          fi

          git diff --name-only --output="$RUNNER_TEMP/changed-files" HEAD
          if [[ ! -s $RUNNER_TEMP/changed-files ]]; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          while IFS= read -r changed_file; do
            if [[ $changed_file != "flake.lock" ]]; then
              echo "Updater changed an unexpected path: $changed_file" >&2
              exit 1
            fi
          done <"$RUNNER_TEMP/changed-files"

          echo "changed=true" >>"$GITHUB_OUTPUT"

      - name: Validate update
        if: steps.detect.outputs.changed == 'true'
        run: |
          set -o errexit
          nix build .#wxread --no-link
          nix flake check --no-build --all-systems --no-write-lock-file
          git diff --check

      - name: Serialize validated patch
        id: serialize
        if: steps.detect.outputs.changed == 'true'
        shell: bash
        run: |
          set -o errexit
          set -o nounset
          set -o pipefail

          git diff --binary --output="$RUNNER_TEMP/lock-update.patch" HEAD
          echo "patch=$(base64 --wrap=0 "$RUNNER_TEMP/lock-update.patch")" >>"$GITHUB_OUTPUT"

  publish:
    name: Publish lock update pull request
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Apply validated update
        env:
          LOCK_UPDATE_PATCH: ${{ needs.update.outputs.patch }}
        run: printf '%s' "$LOCK_UPDATE_PATCH" | base64 --decode | git apply

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.UPDATE_PR_TOKEN || github.token }}
          author: "Aaron's Bot <155336205+3ayonara@users.noreply.github.com>"
          committer: "Aaron's Bot <155336205+3ayonara@users.noreply.github.com>"
          branch: automation/update-lock
          delete-branch: true
          commit-message: |
            build(deps): refresh flake lock

            Refresh pinned flake inputs after the wxread package build and
            flake evaluation checks pass.

            Co-authored-by: Aaron <85681241+27Aaron@users.noreply.github.com>
          title: "build(deps): refresh flake lock"
          body: |
            Refresh the dependency revisions and hashes in `flake.lock`.

            Validation completed on Ubuntu 24.04:
            - `nix build .#wxread --no-link`
            - `nix flake check --no-build --all-systems --no-write-lock-file` (evaluation only)
            - `git diff --check`

            Generated by the flake updater (trigger: `${{ github.event_name }}`).
          assignees: 27Aaron
          labels: |
            automation
            source-update
